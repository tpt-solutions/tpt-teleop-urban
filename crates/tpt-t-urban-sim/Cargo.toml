[package]
name = "tpt-t-urban-sim"
version = "0.1.0"
description = "Headless urban simulator, scenario injection, and egui visualizer."
readme = "README.md"
keywords = ["simulator", "autonomous-driving", "scenario", "digital-twin", "egui"]
categories = ["simulation", "science::robotics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tpt-t-urban-car = { workspace = true }
tpt-t-urban-compliance = { workspace = true }
tpt-t-urban-perception = { workspace = true }
tpt-t-urban-predict = { workspace = true }
tpt-t-urban-safety = { workspace = true }
tpt-t-urban-v2x = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[dev-dependencies]
tpt-t-urban-privacy = { workspace = true }
tpt-t-urban-delivery = { workspace = true }
ring = { workspace = true }

[features]
# The egui visualizer. Off by default, so the workspace builds without the GUI stack.
viz = ["dep:eframe"]

[[bin]]
name = "visualizer"
path = "src/bin/visualizer.rs"
required-features = ["viz"]
