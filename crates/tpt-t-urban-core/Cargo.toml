[package]
name = "tpt-t-urban-core"
version = "0.1.0"
description = "Central deterministic event loop, vehicle state machine, and lock-free message bus."
readme = "README.md"
keywords = ["event-loop", "state-machine", "message-bus", "deterministic", "rkyv"]
categories = ["concurrency", "science::robotics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
rkyv = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
