[toolchain]
# Stable is the workspace default. Nightly is needed only by the two crates
# that use `#![feature(portable_simd)]`: tpt-t-urban-predict (SIMD IMM Kalman
# filter) and tpt-t-urban-privacy (SIMD blur). Those crates pin their own
# nightly in a crate-local rust-toolchain.toml (added in Phases 5 and 8), and
# CI runs them in a separate nightly job. Everything else stays on stable.
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
